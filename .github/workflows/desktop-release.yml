name: Desktop Release

# 触发策略（见 design/2026-05-14-01-Tauri桌面端实现方案.md §9.2）：
#   - tag 推送 (v*)：正式发布触发
#   - workflow_dispatch：手动触发，便于调试
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon
          - platform: macos-14
            args: '--target aarch64-apple-darwin'
            rust-target: aarch64-apple-darwin
            label: macOS Apple Silicon
          # macOS Intel
          - platform: macos-14
            args: '--target x86_64-apple-darwin'
            rust-target: x86_64-apple-darwin
            label: macOS Intel
          # Windows x64
          - platform: windows-latest
            args: '--target x86_64-pc-windows-msvc'
            rust-target: x86_64-pc-windows-msvc
            label: Windows x64
    runs-on: ${{ matrix.platform }}
    name: Build ${{ matrix.label }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.rust-target }}
          # 不缓存 $CARGO_HOME/bin —— 该目录里的 cargo/rustc 是 rustup 二进制的 hardlink，
          # 跨 runner 复用会让 hardlink 指向不存在的 toolchain 路径，导致 `cargo metadata`
          # 实际跑成 `rustup-init` 并报 `unexpected argument 'metadata'`。
          # 参考：https://github.com/Swatinem/rust-cache/pull/216
          cache-bin: false

      - name: Install npm dependencies
        run: npm ci

      - name: Generate Tauri icons
        run: npm run tauri:icons

      # 关键说明（2026-05-14）：
      # tauri-action 内部对 APPLE_CERTIFICATE 只做"存在性"判断（非空字符串就尝试签名），
      # 因此 `secrets.APPLE_CERTIFICATE || ''` 这种 fallback **不能** 跳过签名 —— 反而
      # 会用空字符串调用 `security import "" -k keychain`，必然失败：
      #   "failed codesign application: failed to import keychain certificate"
      #
      # 正确做法：用 env 表达式 + step 级 if，仅当 secret 真正配置时才把它注入
      # `tauri-action` 的 env。下方 if: 中通过 `vars` 不能读 secret 长度，因此走
      # `runner.environment` 不行；改用一个 prepare 步骤先把"是否签名"写入 GITHUB_ENV，
      # 再分流到两个互斥的 tauri-action 调用。
      - name: Detect signing capability
        id: signing
        shell: bash
        env:
          HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' && 'true' || 'false' }}
          HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && 'true' || 'false' }}
        run: |
          echo "apple=$HAS_APPLE_CERT" >> "$GITHUB_OUTPUT"
          echo "updater=$HAS_UPDATER_KEY" >> "$GITHUB_OUTPUT"
          echo "Apple signing: $HAS_APPLE_CERT"
          echo "Updater signing: $HAS_UPDATER_KEY"

      # 路径 A: 完整签名（Apple Certificate + Updater Key 至少其一存在）
      - name: Build and release (signed)
        if: steps.signing.outputs.apple == 'true' || steps.signing.outputs.updater == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS 代码签名 + 公证
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Tauri Updater 签名
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'tt-qimen v__VERSION__'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # 路径 B: 完全不签名（首版常态：用户接受 Gatekeeper / SmartScreen 警告）
      - name: Build and release (unsigned)
        if: steps.signing.outputs.apple == 'false' && steps.signing.outputs.updater == 'false'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # tagName / releaseName 用 v__VERSION__ 占位符：
          # tauri-action 会自动替换为 src-tauri/tauri.conf.json 的 version 字段，
          # 而该字段配置为 "../package.json"，因此最终来源是 package.json 的 version。
          # 单一事实来源，避免漂移。
          tagName: v__VERSION__
          releaseName: 'tt-qimen v__VERSION__'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # ---------------------------------------------------------------------------
  # 所有平台构建完成后，统一发一篇安装说明 + 校验信息到 Release Notes
  # ---------------------------------------------------------------------------
  finalize-release:
    name: Finalize release notes
    needs: build
    runs-on: ubuntu-latest
    # 仅 tag 触发时执行；workflow_dispatch 不会有 ref tag
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 拉全部 tag 历史以便生成 changelog
          fetch-depth: 0

      - name: Resolve previous tag
        id: prev
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${GITHUB_REF_NAME}$" | head -n 1 || true)
          echo "tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"
          echo "Previous tag: ${PREV_TAG:-<none>}"

      - name: Generate auto changelog
        id: changelog
        env:
          PREV_TAG: ${{ steps.prev.outputs.tag }}
          CURR_TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
            COMPARE="https://github.com/${REPO}/commits/${CURR_TAG}"
          else
            RANGE="${PREV_TAG}..${CURR_TAG}"
            COMPARE="https://github.com/${REPO}/compare/${PREV_TAG}...${CURR_TAG}"
          fi
          {
            echo "changelog<<EOF"
            git log --pretty=format:'- %s (%h)' "$RANGE"
            echo ""
            echo "EOF"
            echo "compare_url=${COMPARE}"
          } >> "$GITHUB_OUTPUT"

      - name: Download release assets to compute SHA256
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p /tmp/dl
          # 下载该 release 的全部资产（草稿状态也能拿到）
          gh release download "$TAG" --repo "${{ github.repository }}" --dir /tmp/dl --pattern '*.dmg' --pattern '*.exe' --pattern '*.app.tar.gz' --pattern '*.nsis.zip' || true
          echo "## Downloaded assets" && ls -lh /tmp/dl || true

      - name: Compute SHA256 checksums
        id: sha
        run: |
          if ls /tmp/dl/* > /dev/null 2>&1; then
            (cd /tmp/dl && shasum -a 256 * > /tmp/SHA256SUMS.txt)
            {
              echo "table<<EOF"
              echo "| File | SHA256 |"
              echo "|---|---|"
              awk '{ printf "| `%s` | `%s` |\n", $2, $1 }' /tmp/SHA256SUMS.txt
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "table=_no assets found_" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload SHA256SUMS.txt to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -f /tmp/SHA256SUMS.txt ]; then
            gh release upload "$TAG" /tmp/SHA256SUMS.txt --repo "${{ github.repository }}" --clobber
          fi

      - name: Write rich release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
          COMPARE_URL: ${{ steps.changelog.outputs.compare_url }}
          SHA_TABLE: ${{ steps.sha.outputs.table }}
        run: |
          cat > /tmp/notes.md <<NOTES
          # tt-qimen ${TAG}

          桌面端安装包（macOS Apple Silicon · macOS Intel · Windows x64），所有计算与对话依旧 100% 在本机进行。

          ## 📦 下载

          | 平台 | 文件 | 说明 |
          |---|---|---|
          | macOS (Apple Silicon, M1/M2/M3/M4) | \`tt-qimen_*_aarch64.dmg\` | 优先选 |
          | macOS (Intel) | \`tt-qimen_*_x64.dmg\` | 2020 年前 Mac 选这个 |
          | Windows x64 | \`tt-qimen_*_x64-setup.exe\` | Win10 21H1+ / Win11 |

          ## 🖥 macOS 安装

          1. 下载对应架构的 \`.dmg\`，双击挂载
          2. 把 **tt-qimen.app** 拖到 **Applications** 文件夹
          3. **首次启动必须右键打开**（不要双击！）：
             - 在 Applications 里**右键** → **打开** → 在弹窗中再次点 **打开**
             - 之后可以正常双击启动

          ### macOS 异常处理

          如果系统提示 "tt-qimen 已损坏，无法打开"（这是首版未代码签名导致的 Gatekeeper 误报），在终端执行：

          \`\`\`bash
          xattr -cr /Applications/tt-qimen.app
          \`\`\`

          然后重新打开即可。

          如果仍被拦截，可临时放行单个应用：

          \`\`\`bash
          sudo spctl --master-disable          # 解除 Gatekeeper（不推荐长期）
          sudo xattr -d com.apple.quarantine /Applications/tt-qimen.app
          \`\`\`

          ## 🖥 Windows 安装

          1. 下载 \`tt-qimen_*_x64-setup.exe\`
          2. **首次启动 SmartScreen 弹窗时**：
             - 点 **More info / 详细信息**
             - 再点 **Run anyway / 仍然运行**
          3. 按引导完成安装（会安装到 \`C:\\Program Files\\tt-qimen\\\`）

          ### Windows 异常处理

          如果 SmartScreen 没有 "Run anyway" 按钮，先右键解锁文件：

          \`\`\`powershell
          # PowerShell（管理员）
          Unblock-File -Path "\$env:USERPROFILE\Downloads\tt-qimen_*_x64-setup.exe"
          \`\`\`

          如果杀毒软件误报（首版未代码签名常见），添加白名单后重新安装即可。

          ## 🔄 自动更新

          应用启动 5 秒后会静默检查更新。检测到新版本会弹原生对话框，用户确认后自动下载补丁并重启应用（Tauri Updater 签名校验保障安全）。

          ## 🔐 SHA256 校验

          下载 \`SHA256SUMS.txt\` 后可验证文件完整性：

          \`\`\`bash
          # macOS / Linux
          shasum -a 256 -c SHA256SUMS.txt

          # Windows PowerShell
          Get-FileHash tt-qimen_*.exe -Algorithm SHA256
          \`\`\`

          ${SHA_TABLE}

          ## 📝 Changelog

          ${CHANGELOG}

          **Full diff**: ${COMPARE_URL}
          NOTES

          gh release edit "$TAG" --repo "${{ github.repository }}" --notes-file /tmp/notes.md --draft=false
