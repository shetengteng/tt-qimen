name: Desktop Release

# 触发策略（见 design/2026-05-14-01-Tauri桌面端实现方案.md §9.2）：
#   - tag 推送 (v*)：正式发布触发
#   - workflow_dispatch：手动触发，便于调试
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Universal: 在 macos-14 (Apple Silicon) runner 上交叉编译
          - platform: macos-14
            target: 'universal-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          # Windows x64
          - platform: windows-latest
            target: ''
            rust-targets: ''
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      # Linux runner 需要 webkit2gtk 等系统依赖；当前 matrix 不含 Linux，留作扩展。
      # - name: Install Linux dependencies
      #   if: matrix.platform == 'ubuntu-22.04'
      #   run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.platform }}-${{ matrix.target }}

      - name: Install npm dependencies
        run: npm ci

      - name: Generate Tauri icons
        run: npm run tauri:icons

      - name: Build and release desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 以下 Secrets 缺失时会以空字符串注入，tauri-action 会自动跳过对应签名步骤，
          # 因此 unsigned 构建无需任何额外配置即可跑通。
          # macOS 代码签名 + 公证（详见 design §11.1）
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || '' }}
          # Tauri Updater 签名（详见 design §11.3）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'tt-qimen ${{ github.ref_name }}'
          releaseBody: |
            ## tt-qimen ${{ github.ref_name }}

            桌面端安装包（macOS Universal + Windows x64）。

            > **首版未代码签名**：macOS 用户右键 → 打开；Windows 用户点击"More info → Run anyway"。
            > 详细安装/升级说明见 [README.md](https://github.com/${{ github.repository }}/blob/main/README.md#-桌面端-tauri-2)。

            Changelog: see commits since previous tag.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}
